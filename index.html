<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MY ARMY 2026</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<style>
body{margin:0;background:#0f0f0f;color:white;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;text-align:center}
.card{background:#1a1a1a;border:1px solid #333;border-radius:20px;padding:24px;width:90%;max-width:400px}
h1{background:linear-gradient(90deg,#ffd700,#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:32px}
.btn{background:linear-gradient(90deg,#ffd700,#ffaa00);color:#000;border:none;padding:14px;border-radius:12px;font-weight:bold;width:100%;margin-top:16px}
#wallet-address{word-break:break-all;background:#222;padding:10px;border-radius:8px;margin-top:12px;font-size:12px;display:none}
</style>
</head>
<body>
<div class="card">
<h1>MY ARMY 2026</h1>
<p>Commander! TON Wallet-аа холбоод армидаа нэгд.</p>
<div id="ton-connect"></div>
<div id="wallet-address"></div>
<button class="btn" onclick="enterArmy()">⚔️ Армид Нэгдэх</button>
<p style="color:#888;font-size:12px;margin-top:10px">Powered by TON</p>
</div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}
const tonConnectUI=new TON_CONNECT_UI.TonConnectUI({manifestUrl:'https://ton-connect.github.io/demo-dapp-with-wallet/tonconnect-manifest.json',buttonRootId:'ton-connect'});
tonConnectUI.onStatusChange(w=>{const d=document.getElementById('wallet-address');if(w){d.style.display='block';d.textContent='Connected: '+w.account.address}else d.style.display='none'});
function enterArmy(){if(!tonConnectUI.wallet){alert('Эхлээд Wallet-аа холбоно уу!');tonConnectUI.openModal();return;}alert('MY ARMY 2026-д тавтай морил!');}
</script>
</body>
</html>
